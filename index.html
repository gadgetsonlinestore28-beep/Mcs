<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>মেরিট কেয়ার স্কুল — ম্যানেজমেন্ট সিস্টেম</title>
<style>
:root{--bg:#f4f6fb;--c:#fff;--t:#1b2333;--m:#6b7588;--p:#1e63d6;--b:#dfe4ee;--ok:#13824b;--no:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--c:#182033;--t:#e8ecf5;--m:#93a0b8;--b:#2a3550}}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Bengali","SolaimanLipi",sans-serif;background:var(--bg);color:var(--t)}
header{padding:10px 14px;background:var(--p);color:#fff;font-weight:700}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;max-width:1000px;margin:auto}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--b);background:var(--c);color:var(--t);padding:10px 2px;border-radius:12px;font:inherit;font-size:11px;cursor:pointer;width:100%}
nav button .ic{font-size:26px;line-height:1}
@media(min-width:700px){nav{grid-template-columns:repeat(8,1fr)}}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:7;padding:8px;overflow:auto}
#pbox{background:var(--bg);border-radius:14px;width:100%;max-width:1000px;margin:0 auto;min-height:60vh}
#ph{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--p);color:#fff;border-radius:14px 14px 0 0;position:sticky;top:0;z-index:2}
#ph button{width:auto;background:#0003;color:#fff;border:0;padding:6px 12px}#mn{padding:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--b)}.stat b{display:block;font-size:22px;margin-top:4px}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);width:100%}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:8px}
.btn{background:var(--p);color:#fff;border:0;cursor:pointer;width:auto;padding:8px 14px}.btn.r{background:var(--no)}.btn.s{padding:4px 9px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px;border-bottom:1px solid var(--b);text-align:left}
.sc{overflow-x:auto}h3{margin:0 0 10px}.m{color:var(--m);font-size:12px;display:block}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:9}
#rc{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:8;padding:12px}
#rcb{background:#fff;color:#000;padding:18px;border-radius:10px;width:100%;max-width:380px}#rcb h2,#rcb p{margin:4px 0;text-align:center}
.idc{display:inline-block;width:230px;border:2px solid var(--p);border-radius:10px;padding:10px;margin:6px;text-align:center;background:#fff;color:#000;vertical-align:top}
@media print{#pop{position:static!important;background:none!important;overflow:visible!important;display:block!important}body *{visibility:hidden}.pa,.pa *{visibility:visible}.pa{position:absolute;left:0;top:0;width:100%}.np{display:none!important}#rc{position:static;background:none}}
</style></head><body>
<header>মেরিট কেয়ার স্কুল, হাবিবপুর — ম্যানেজমেন্ট সিস্টেম</header>
<nav id="nv"></nav><div id="hm" style="padding:0 12px 12px;max-width:1000px;margin:auto"></div>
<div id="pop"><div id="pbox"><div id="ph" class="np"><b id="pt"></b><button id="px">✕ বন্ধ</button></div><div id="mn"></div></div></div>
<div id="rc"><div id="rcb" class="pa"></div></div><div id="toast"></div>

<script type="module">
let initializeApp,getFirestore,collection,addDoc,getDocs,doc,getDoc,setDoc,deleteDoc,runTransaction,fbErr="";
try{
 ({initializeApp}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"));
 ({getFirestore,collection,addDoc,getDocs,doc,getDoc,setDoc,deleteDoc,runTransaction}=await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"));
}catch(e){fbErr="<div class='card'><h3>Firebase লোড হয়নি</h3><p>ইন্টারনেট আছে কি না দেখুন। এই ফাইলটি Claude-এর প্রিভিউতে চলে না — GitHub Pages বা সরাসরি ব্রাউজারে খুলুন।</p></div>"}

/* ===== আপনার Firebase কনফিগ এখানে বসান ===== */
const cfg={apiKey:"YOUR_API_KEY",authDomain:"mcs-habibpur.firebaseapp.com",projectId:"mcs-habibpur",storageBucket:"mcs-habibpur.appspot.com",messagingSenderId:"",appId:"YOUR_APP_ID"};
let db;try{db=getFirestore(initializeApp(cfg))}catch(e){fbErr=fbErr||"<div class='card'>Firebase কনফিগ ঠিক নেই</div>"}

const CL=["প্লে","নার্সারি","১ম","২য়","৩য়","৪র্থ","৫ম","৬ষ্ঠ","৭ম","৮ম","৯ম","১০ম"];
const HEADS=["মাসিক বেতন","ভর্তি ফি","পরীক্ষা ফি","সেশন চার্জ","অন্যান্য"];
const DAYS=["শনি","রবি","সোম","মঙ্গল","বুধ","বৃহঃ","শুক্র"];
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};
const toast=m=>{const t=$("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2600)};
const opts=(a,v)=>a.map(x=>`<option ${x===v?"selected":""}>${esc(x)}</option>`).join("");
const all=async c=>{try{return(await getDocs(collection(db,c))).docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))}catch(e){toast("লোড ব্যর্থ: "+e.code);return[]}};
const add=(c,o)=>addDoc(collection(db,c),{...o,createdAt:Date.now()});
let students=[];
const loadS=async()=>{students=(await all("students")).sort((a,b)=>(a.cls+a.roll).localeCompare(b.cls+b.roll,"bn",{numeric:true}))};

/* ---- জেনেরিক মডিউল (ফর্ম + তালিকা + CSV) : [key,লেবেল,টাইপ(t/n/d/s),অপশন] ---- */
const MODS={
 stu:{c:"students",t:"শিক্ষার্থী",f:[["name","নাম"],["cls","ক্লাস","s",CL],["roll","রোল"],["dob","জন্ম তারিখ","d"],["guardian","অভিভাবক"],["phone","মোবাইল"],["addr","ঠিকানা"],["status","অবস্থা","s",["চলমান","পাশ/অ্যালামনাই","টিসি/বদলি"]]]},
 adm:{c:"admissions",t:"ভর্তি আবেদন",f:[["name","আবেদনকারীর নাম"],["cls","ভর্তির ক্লাস","s",CL],["guardian","অভিভাবক"],["phone","মোবাইল"],["date","তারিখ","d"],["status","অবস্থা","s",["আবেদন","অনুমোদিত","বাতিল"]]]},
 staff:{c:"staff",t:"শিক্ষক/কর্মচারী",f:[["name","নাম"],["desig","পদবি"],["dept","বিভাগ"],["phone","মোবাইল"],["salary","মাসিক বেতন","n"],["join","যোগদান","d"],["contract","চুক্তি/নিয়োগ"]]},
 leave:{c:"leaves",t:"ছুটি",f:[["staff","শিক্ষকের নাম"],["from","শুরু","d"],["to","শেষ","d"],["reason","কারণ"],["status","অবস্থা","s",["আবেদন","অনুমোদিত","বাতিল"]]]},
 subj:{c:"subjects",t:"বিষয় বরাদ্দ",f:[["cls","ক্লাস","s",CL],["name","বিষয়"],["teacher","শিক্ষক"],["syllabus","সিলেবাস/লেসন প্ল্যান"]]},
 rout:{c:"routine",t:"ক্লাস রুটিন",f:[["cls","ক্লাস","s",CL],["day","দিন","s",DAYS],["period","পিরিয়ড"],["subject","বিষয়"],["teacher","শিক্ষক"]]},
 hw:{c:"homework",t:"হোমওয়ার্ক",f:[["cls","ক্লাস","s",CL],["subject","বিষয়"],["task","কাজ"],["due","জমার তারিখ","d"]]},
 exam:{c:"exams",t:"পরীক্ষা সূচি",f:[["name","পরীক্ষার নাম"],["cls","ক্লাস","s",CL],["subject","বিষয়"],["date","তারিখ","d"],["time","সময়"]]},
 marks:{c:"marks",t:"নম্বর এন্ট্রি",f:[["exam","পরীক্ষার নাম"],["cls","ক্লাস","s",CL],["roll","রোল"],["subject","বিষয়"],["marks","প্রাপ্ত নম্বর","n"],["full","পূর্ণমান","n"]]},
 notice:{c:"notices",t:"নোটিশ/ইভেন্ট",f:[["title","শিরোনাম"],["body","বিবরণ"],["date","তারিখ","d"]]},
 book:{c:"books",t:"বই",f:[["title","বইয়ের নাম"],["author","লেখক"],["cat","ক্যাটাগরি"],["copies","কপি","n"]]},
 issue:{c:"issues",t:"বই ইস্যু/ফেরত",f:[["book","বই"],["member","সদস্য (নাম/রোল)"],["issue","ইস্যু","d"],["ret","ফেরত","d"],["fine","জরিমানা","n"]]},
 inv:{c:"inventory",t:"ইনভেন্টরি/অ্যাসেট",f:[["item","আইটেম"],["type","ধরন","s",["স্টেশনারি","আসবাব","ইলেকট্রনিক্স","অন্যান্য"]],["qty","পরিমাণ","n"],["date","ক্রয় তারিখ","d"],["price","মূল্য","n"],["place","অবস্থান"]]},
 cmp:{c:"complaints",t:"অভিযোগ/মতামত",f:[["from","কার কাছ থেকে"],["text","বিবরণ"],["date","তারিখ","d"],["status","অবস্থা","s",["নতুন","চলমান","সমাধান"]]]}
};
const TABS=[["stu","শিক্ষার্থী","🎓"],["adm","ভর্তি","📝"],["staff","শিক্ষক/স্টাফ","👩‍🏫"],["att","ছাত্র হাজিরা","✅"],["tatt","শিক্ষক হাজিরা","🕒"],["rep","হাজিরা রিপোর্ট","📊"],["leave","ছুটি","🏖️"],["pay","বেতন শিট","💵"],["subj","বিষয়","📚"],["rout","রুটিন","🗓️"],["hw","হোমওয়ার্ক","📒"],["exam","পরীক্ষা","📄"],["marks","নম্বর","✏️"],["res","ফলাফল","🏆"],["fee","ফি আদায়","💰"],["due","বকেয়া","⏳"],["acc","আয়-ব্যয়","📈"],["notice","নোটিশ","📢"],["cmp","অভিযোগ","💬"],["book","লাইব্রেরি বই","📖"],["issue","বই ইস্যু","🔄"],["inv","ইনভেন্টরি","📦"],["idc","ID কার্ড","🪪"],["bak","ব্যাকআপ","💾"]];
const PAGES={dash,att:()=>att(0),tatt:()=>att(1),rep,pay,res,fee,due,acc,idc,bak};
$("nv").innerHTML=TABS.map(([k,v,i])=>`<button data-k="${k}"><span class="ic">${i}</span>${v}</button>`).join("");
$("nv").onclick=e=>{const b=e.target.closest("button");if(b)go(b.dataset.k)};
$("px").onclick=()=>$("pop").style.display="none";
$("pop").onclick=e=>{if(e.target.id==="pop")$("pop").style.display="none"};
async function go(k){const t=TABS.find(x=>x[0]===k);$("pt").textContent=t[2]+" "+t[1];$("pop").style.display="block";$("pop").scrollTop=0;$("mn").innerHTML=fbErr||"লোড হচ্ছে...";if(fbErr)return;await(PAGES[k]?PAGES[k]():crud(k))}

const fld=([k,l,t,o])=>`<div><span class="m">${l}</span>${t==="s"?`<select id="f_${k}">${opts(o)}</select>`:`<input id="f_${k}" type="${t==="n"?"number":t==="d"?"date":"text"}" ${t==="d"?`value="${today()}"`:""}>`}</div>`;
async function crud(k){
  const m=MODS[k];
  $("mn").innerHTML=`<div class="card"><h3>${m.t}</h3><div class="row">${m.f.map(fld).join("")}</div><button class="btn" id="sv">সংরক্ষণ</button> <button class="btn" id="ex" style="background:var(--ok)">Excel(CSV)</button></div><div class="card sc"><input id="q" placeholder="খুঁজুন..." style="margin-bottom:8px"><div id="ls"></div></div>`;
  let rows=await all(m.c);
  const draw=()=>{const q=$("q").value.trim();const a=rows.filter(r=>!q||JSON.stringify(r).includes(q));
    $("ls").innerHTML=`<table><tr>${m.f.map(f=>`<th>${f[1]}</th>`).join("")}<th></th></tr>`+a.map(r=>`<tr>${m.f.map(f=>`<td>${esc(r[f[0]])}</td>`).join("")}<td><button class="btn r s" data-d="${r.id}">মুছুন</button></td></tr>`).join("")+`</table>`};
  draw();$("q").oninput=draw;
  $("ls").onclick=async e=>{const id=e.target.dataset.d;if(id&&confirm("মুছে ফেলবেন?")){await deleteDoc(doc(db,m.c,id));rows=rows.filter(r=>r.id!==id);if(k==="stu")await loadS();draw()}};
  $("ex").onclick=()=>csv(m.t,[m.f.map(f=>f[1]),...rows.map(r=>m.f.map(f=>r[f[0]]??""))]);
  $("sv").onclick=async()=>{const o={};m.f.forEach(([key,,t])=>{const v=$("f_"+key).value.trim?.()??$("f_"+key).value;o[key]=t==="n"?+v||0:v});
    if(!Object.values(o)[0])return toast("প্রথম ঘরটি পূরণ করুন");
    await add(m.c,o);toast("সংরক্ষিত");if(k==="stu")await loadS();crud(k)};
}
function csv(name,a){const s="\ufeff"+a.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n");
  const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));l.download=name+"-"+today()+".csv";l.click()}

/* ---- ড্যাশবোর্ড ---- */
async function dash(){
  await loadS();const [p,ie,st,ab]=await Promise.all([all("payments"),all("incomeExpense"),all("staff"),all("attendance")]);
  const mo=today().slice(0,7),sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0);
  const fT=sum(p.filter(x=>x.date===today())),fM=sum(p.filter(x=>x.date.startsWith(mo)));
  const inc=fM+sum(ie.filter(x=>x.type==="আয়"&&x.date.startsWith(mo))),exp=sum(ie.filter(x=>x.type==="ব্যয়"&&x.date.startsWith(mo)));
  const td=ab.filter(a=>a.date===today()&&a.kind==="s"),pr=td.reduce((s,a)=>s+a.total-a.absent.length,0),tt=td.reduce((s,a)=>s+a.total,0);
  $("hm").innerHTML=`<div class="grid">
  <div class="stat">শিক্ষার্থী<b>${students.length}</b></div><div class="stat">শিক্ষক/স্টাফ<b>${st.length}</b></div>
  <div class="stat">আজ উপস্থিতি<b>${tt?Math.round(pr*100/tt)+"%":"—"}</b></div><div class="stat">আজকের ফি<b>৳${fT}</b></div>
  <div class="stat">এ মাসের আয়<b>৳${inc}</b></div><div class="stat">এ মাসের ব্যয়<b>৳${exp}</b></div>
  <div class="stat">ব্যালেন্স<b style="color:${inc>=exp?"var(--ok)":"var(--no)"}">৳${inc-exp}</b></div></div>`;
}

/* ---- হাজিরা (ছাত্র/শিক্ষক) ---- */
async function att(T){
  $("mn").innerHTML=`<div class="card"><h3>${T?"শিক্ষক":"শিক্ষার্থী"} হাজিরা</h3><div class="row">${T?"":`<select id="c">${opts(CL)}</select>`}<input id="d" type="date" value="${today()}"><button class="btn" id="ld">লোড</button></div><div class="sc" id="ls"></div></div>`;
  $("ld").onclick=async()=>{const c=T?"":$("c").value,d=$("d").value,id=(T?"t_":"s_")+d+"_"+c;
    if(!T)await loadS();const list=T?await all("staff"):students.filter(s=>s.cls===c&&s.status!=="টিসি/বদলি");
    if(!list.length)return $("ls").innerHTML="<p class='m'>তালিকা খালি</p>";
    const ex=await getDoc(doc(db,"attendance",id)),ab=new Set(ex.exists()?ex.data().absent:[]);
    $("ls").innerHTML=`<table><tr><th>${T?"পদবি":"রোল"}</th><th>নাম</th><th>অনুপস্থিত</th></tr>`+list.map(s=>`<tr><td>${esc(T?s.desig:s.roll)}</td><td>${esc(s.name)}</td><td><input type="checkbox" style="width:auto" data-i="${s.id}" ${ab.has(s.id)?"checked":""}></td></tr>`).join("")+`</table><br><button class="btn" id="sa">সংরক্ষণ</button>`;
    $("sa").onclick=async()=>{const absent=[...document.querySelectorAll("[data-i]:checked")].map(x=>x.dataset.i);
      await setDoc(doc(db,"attendance",id),{kind:T?"t":"s",date:d,cls:c,total:list.length,absent,createdAt:Date.now()});
      toast(`সংরক্ষিত — উপস্থিত ${list.length-absent.length}, অনুপস্থিত ${absent.length}`)}};
}
async function rep(){
  $("mn").innerHTML=`<div class="card"><h3>মাসিক হাজিরা রিপোর্ট</h3><div class="row"><select id="c">${opts(CL)}</select><input id="mo" type="month" value="${today().slice(0,7)}"><button class="btn" id="ld">দেখুন</button></div><div class="sc pa" id="ls"></div><button class="btn np" onclick="window.print()">প্রিন্ট</button></div>`;
  $("ld").onclick=async()=>{await loadS();const c=$("c").value,mo=$("mo").value;
    const a=(await all("attendance")).filter(x=>x.kind==="s"&&x.cls===c&&x.date.startsWith(mo)),days=a.length;
    $("ls").innerHTML=`<p>${esc(c)} — ${mo} (হাজিরা নেওয়া হয়েছে ${days} দিন)</p><table><tr><th>রোল</th><th>নাম</th><th>অনুপস্থিত</th><th>উপস্থিতি %</th></tr>`+
    students.filter(s=>s.cls===c).map(s=>{const n=a.filter(x=>x.absent.includes(s.id)).length;return`<tr><td>${esc(s.roll)}</td><td>${esc(s.name)}</td><td>${n}</td><td>${days?Math.round((days-n)*100/days):"—"}</td></tr>`}).join("")+`</table>`}
}

/* ---- বেতন শিট ---- */
async function pay(){
  const st=await all("staff"),tot=st.reduce((s,x)=>s+(+x.salary||0),0);
  $("mn").innerHTML=`<div class="card"><h3>বেতন শিট</h3><div class="row"><input id="mo" type="month" value="${today().slice(0,7)}"></div><div class="sc pa"><h3>মেরিট কেয়ার স্কুল — বেতন শিট <span id="mt"></span></h3><table><tr><th>নাম</th><th>পদবি</th><th>বেতন</th><th>স্বাক্ষর</th></tr>`+
  st.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.desig)}</td><td>${x.salary||0}</td><td></td></tr>`).join("")+`<tr><th colspan="2">মোট</th><th>৳${tot}</th><th></th></tr></table></div><br>
  <button class="btn np" onclick="window.print()">প্রিন্ট</button> <button class="btn np" id="ad" style="background:var(--ok)">ব্যয়ে যোগ করুন</button></div>`;
  $("mt").textContent=$("mo").value;$("mo").onchange=()=>$("mt").textContent=$("mo").value;
  $("ad").onclick=async()=>{if(!tot)return;await add("incomeExpense",{type:"ব্যয়",cat:"শিক্ষক বেতন",amount:tot,date:today(),note:$("mo").value});toast("ব্যয়ে যোগ হয়েছে")};
}

/* ---- পরীক্ষার ফলাফল (GPA, মেধাতালিকা) ---- */
const gp=p=>p>=80?[5,"A+"]:p>=70?[4,"A"]:p>=60?[3.5,"A-"]:p>=50?[3,"B"]:p>=40?[2,"C"]:p>=33?[1,"D"]:[0,"F"];
async function res(){
  await loadS();const mk=await all("marks"),names=[...new Set(mk.map(x=>x.exam))];
  $("mn").innerHTML=`<div class="card"><h3>ফলাফল ও মেধাতালিকা</h3><div class="row"><select id="e">${opts(names)}</select><select id="c">${opts(CL)}</select><button class="btn" id="ld">দেখুন</button></div><div class="sc pa" id="ls"></div><button class="btn np" onclick="window.print()">প্রিন্ট</button></div>`;
  $("ld").onclick=()=>{const e=$("e").value,c=$("c").value,g={};
    mk.filter(x=>x.exam===e&&x.cls===c).forEach(x=>(g[x.roll]??=[]).push(x));
    const r=Object.entries(g).map(([roll,a])=>{const tot=a.reduce((s,x)=>s+x.marks,0),full=a.reduce((s,x)=>s+(x.full||100),0),ps=a.map(x=>gp(x.marks*100/(x.full||100)));
      const fail=ps.some(p=>p[0]===0),gpa=fail?0:ps.reduce((s,p)=>s+p[0],0)/ps.length;
      return{roll,name:students.find(s=>s.cls===c&&s.roll===roll)?.name||"",tot,full,gpa,grade:fail?"F":gp(gpa*20>=100?100:gpa*16.4)[1]}}).sort((a,b)=>b.tot-a.tot);
    $("ls").innerHTML=`<p>${esc(e)} — ক্লাস ${esc(c)}</p><table><tr><th>মেধা</th><th>রোল</th><th>নাম</th><th>মোট/${r[0]?.full||""}</th><th>GPA</th></tr>`+r.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.roll)}</td><td>${esc(x.name)}</td><td>${x.tot}</td><td>${x.gpa.toFixed(2)}${x.gpa?"":" (F)"}</td></tr>`).join("")+`</table>`};
}

/* ---- ফি আদায় + রিসিপ্ট ---- */
async function fee(){
  await loadS();
  $("mn").innerHTML=`<div class="card"><h3>ফি আদায়</h3><div class="row"><select id="c">${opts(CL)}</select><select id="s"></select></div>
  <div class="row"><select id="h">${opts(HEADS)}</select><input id="mo" type="month" value="${today().slice(0,7)}"><input id="a" type="number" placeholder="টাকা"><input id="ds" type="number" placeholder="ছাড়/জরিমানা (+/-)"></div><button class="btn" id="sv">আদায় ও রিসিপ্ট</button></div>
  <div class="card sc"><h3>সাম্প্রতিক রিসিপ্ট</h3><div id="ls"></div></div>`;
  const fill=()=>$("s").innerHTML=students.filter(s=>s.cls===$("c").value).map(s=>`<option value="${s.id}">${esc(s.roll)} — ${esc(s.name)}</option>`).join("");
  $("c").onchange=fill;fill();
  const rows=async()=>{const p=(await all("payments")).slice(0,50);$("ls").innerHTML=`<table><tr><th>নং</th><th>তারিখ</th><th>নাম</th><th>খাত</th><th>৳</th><th></th></tr>`+p.map(x=>`<tr><td>${x.no}</td><td>${x.date}</td><td>${esc(x.name)}</td><td>${esc(x.head)}</td><td>${x.amount}</td><td><button class="btn s" data-p='${esc(JSON.stringify(x))}'>প্রিন্ট</button></td></tr>`).join("")+`</table>`};rows();
  $("ls").onclick=e=>{if(e.target.dataset.p)receipt(JSON.parse(e.target.dataset.p))};
  $("sv").onclick=async()=>{const st=students.find(x=>x.id===$("s").value),amt=(+$("a").value)+(+$("ds").value||0);if(!st||!(amt>0))return toast("শিক্ষার্থী ও টাকা দিন");
    const rec={sid:st.id,name:st.name,cls:st.cls,roll:st.roll,head:$("h").value,month:$("mo").value,amount:amt,date:today()};
    try{await runTransaction(db,async t=>{const cr=doc(db,"settings","counter"),cs=await t.get(cr),no=(cs.exists()?cs.data().receipt:0)+1;
      t.set(cr,{receipt:no},{merge:true});t.set(doc(collection(db,"payments")),{...rec,no,createdAt:Date.now()});rec.no=no});
      toast("আদায় সম্পন্ন");receipt(rec);rows();$("a").value=""}catch(e){toast("ব্যর্থ: "+e.code)}};
}
function receipt(r){
  $("rcb").innerHTML=`<h2>মেরিট কেয়ার স্কুল</h2><p>হাবিবপুর</p><p><b>ফি রিসিপ্ট #${r.no}</b></p><hr><table style="width:100%"><tr><td>তারিখ</td><td>${r.date}</td></tr><tr><td>নাম</td><td>${esc(r.name)}</td></tr><tr><td>ক্লাস/রোল</td><td>${esc(r.cls)} / ${esc(r.roll)}</td></tr><tr><td>খাত</td><td>${esc(r.head)} (${esc(r.month)})</td></tr><tr><td><b>পরিমাণ</b></td><td><b>৳${r.amount}</b></td></tr></table><hr><p style="color:#555">গৃহীতা স্বাক্ষর: ________</p>
  <div class="np" style="text-align:center"><button class="btn" onclick="window.print()">প্রিন্ট</button> <button class="btn r" onclick="document.getElementById('rc').style.display='none'">বন্ধ</button></div>`;$("rc").style.display="flex"}

/* ---- বকেয়া তালিকা (মাসভিত্তিক বেতন) ---- */
async function due(){
  await loadS();const p=await all("payments");
  $("mn").innerHTML=`<div class="card"><h3>মাসিক বেতন বকেয়া</h3><div class="row"><select id="c">${opts(CL)}</select><input id="mo" type="month" value="${today().slice(0,7)}"><button class="btn" id="ld">দেখুন</button></div><div class="sc pa" id="ls"></div><button class="btn np" onclick="window.print()">প্রিন্ট</button></div>`;
  $("ld").onclick=()=>{const c=$("c").value,mo=$("mo").value,paid=new Set(p.filter(x=>x.head==="মাসিক বেতন"&&x.month===mo).map(x=>x.sid));
    const d=students.filter(s=>s.cls===c&&s.status!=="টিসি/বদলি"&&!paid.has(s.id));
    $("ls").innerHTML=`<p>${esc(c)} — ${mo}: বকেয়া ${d.length} জন</p><table><tr><th>রোল</th><th>নাম</th><th>অভিভাবক</th><th>মোবাইল</th></tr>`+d.map(s=>`<tr><td>${esc(s.roll)}</td><td>${esc(s.name)}</td><td>${esc(s.guardian)}</td><td>${esc(s.phone)}</td></tr>`).join("")+`</table>`};
}

/* ---- আয়-ব্যয় + লেজার ---- */
async function acc(){
  $("mn").innerHTML=`<div class="card"><h3>আয়-ব্যয়</h3><div class="row"><select id="t"><option>ব্যয়</option><option>আয়</option></select><input id="k" placeholder="খাত"><input id="a" type="number" placeholder="টাকা"><input id="d" type="date" value="${today()}"><input id="nt" placeholder="বিবরণ/ভাউচার"></div><button class="btn" id="sv">সংরক্ষণ</button></div><div class="card sc"><div id="ls"></div></div>`;
  const rows=async()=>{const a=await all("incomeExpense"),i=a.filter(x=>x.type==="আয়").reduce((s,x)=>s+x.amount,0),e=a.filter(x=>x.type==="ব্যয়").reduce((s,x)=>s+x.amount,0);
    $("ls").innerHTML=`<p>এন্ট্রি আয়: ৳${i} | ব্যয়: ৳${e} (ফি আদায় আলাদা, ড্যাশবোর্ডে যুক্ত)</p><table><tr><th>তারিখ</th><th>ধরন</th><th>খাত</th><th>৳</th><th>বিবরণ</th></tr>`+a.map(x=>`<tr><td>${x.date}</td><td style="color:${x.type==="আয়"?"var(--ok)":"var(--no)"}">${x.type}</td><td>${esc(x.cat)}</td><td>${x.amount}</td><td>${esc(x.note)}</td></tr>`).join("")+`</table>`};rows();
  $("sv").onclick=async()=>{const a=+$("a").value;if(!(a>0)||!$("k").value.trim())return toast("খাত ও টাকা দিন");
    await add("incomeExpense",{type:$("t").value,cat:$("k").value.trim(),amount:a,date:$("d").value,note:$("nt").value.trim()});toast("সংরক্ষিত");$("a").value=$("k").value="";rows()};
}

/* ---- ID কার্ড ---- */
async function idc(){
  await loadS();const st=await all("staff");
  $("mn").innerHTML=`<div class="card"><h3>ID কার্ড</h3><div class="row"><select id="c">${opts(["শিক্ষক/স্টাফ",...CL])}</select><button class="btn" id="ld">তৈরি</button> <button class="btn np" onclick="window.print()">প্রিন্ট</button></div><div class="pa" id="ls"></div></div>`;
  $("ld").onclick=()=>{const c=$("c").value,l=c==="শিক্ষক/স্টাফ"?st.map(x=>[x.name,x.desig,x.phone]):students.filter(s=>s.cls===c).map(s=>[s.name,"ক্লাস "+s.cls+" | রোল "+s.roll,s.phone]);
    $("ls").innerHTML=l.map(x=>`<div class="idc"><b>মেরিট কেয়ার স্কুল</b><br><small>হাবিবপুর</small><hr><b>${esc(x[0])}</b><br>${esc(x[1])}<br><small>মোবাইল: ${esc(x[2])}</small></div>`).join("")};
}

/* ---- ব্যাকআপ / রিস্টোর ---- */
const COLS=["students","admissions","staff","leaves","subjects","routine","homework","exams","marks","notices","books","issues","inventory","complaints","payments","incomeExpense","attendance","settings"];
async function bak(){
  $("mn").innerHTML=`<div class="card"><h3>ব্যাকআপ ও রিস্টোর</h3><p class="m">নিয়মিত ডাউনলোড করে হার্ডডিস্ক/পেনড্রাইভে রাখুন।</p><button class="btn" id="b">সব ডেটা ডাউনলোড (JSON)</button><hr><span class="m">রিস্টোর (ব্যাকআপ ফাইল বাছুন)</span><input type="file" id="f" accept=".json"></div>`;
  $("b").onclick=async()=>{const o={};for(const c of COLS)o[c]=await all(c);
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:"application/json"}));a.download="mcs-backup-"+today()+".json";a.click()};
  $("f").onchange=async e=>{if(!confirm("বর্তমান ডেটার ওপর রিস্টোর হবে। নিশ্চিত?"))return;const o=JSON.parse(await e.target.files[0].text());let n=0;
    for(const c of COLS)for(const {id,...r} of o[c]||[]){await setDoc(doc(db,c,id),r);n++}toast(n+" টি রেকর্ড রিস্টোর হয়েছে")};
}
fbErr?$("hm").innerHTML=fbErr:dash();
