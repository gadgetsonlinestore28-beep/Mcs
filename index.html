<style>
:root{--bg:#f4f6fb;--c:#fff;--t:#1b2333;--m:#6b7588;--p:#1e63d6;--b:#dfe4ee;--ok:#13824b;--no:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#0f1420;--c:#182033;--t:#e8ecf5;--m:#93a0b8;--b:#2a3550}}
*{box-sizing:border-box}body{margin:0;font-family:"Noto Sans Bengali","SolaimanLipi",sans-serif;background:var(--bg);color:var(--t)}
header{padding:10px 14px;background:var(--p);color:#fff;font-weight:700}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;max-width:1000px;margin:auto}
nav button{display:flex;flex-direction:column;align-items:center;gap:4px;border:1px solid var(--b);background:var(--c);color:var(--t);padding:10px 2px;border-radius:12px;font:inherit;font-size:11px;cursor:pointer;width:100%}
nav button .ic{font-size:26px;line-height:1}
@media(min-width:700px){nav{grid-template-columns:repeat(8,1fr)}}
#pop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:7;padding:8px;overflow:auto}
#pbox{background:var(--bg);border-radius:14px;width:100%;max-width:1000px;margin:0 auto;min-height:60vh}
#ph{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--p);color:#fff;border-radius:14px 14px 0 0;position:sticky;top:0;z-index:2}
#ph button{width:auto;background:#0003;color:#fff;border:0;padding:6px 12px}#mn{padding:12px}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{padding:12px;border-radius:10px;background:var(--bg);border:1px solid var(--b)}.stat b{display:block;font-size:22px;margin-top:4px}
input,select,button{font:inherit;padding:8px 10px;border:1px solid var(--b);border-radius:8px;background:var(--c);color:var(--t);width:100%}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:8px}
.btn{background:var(--p);color:#fff;border:0;cursor:pointer;width:auto;padding:8px 14px}.btn.r{background:var(--no)}.btn.s{padding:4px 9px;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px;border-bottom:1px solid var(--b);text-align:left}
.sc{overflow-x:auto}h3{margin:0 0 10px}.m{color:var(--m);font-size:12px;display:block}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:9}
#rc{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:8;padding:12px}
#rcb{background:#fff;color:#000;padding:18px;border-radius:10px;width:100%;max-width:380px}#rcb h2,#rcb p{margin:4px 0;text-align:center}
.idc{display:inline-block;width:230px;border:2px solid var(--p);border-radius:10px;padding:10px;margin:6px;text-align:center;background:#fff;color:#000;vertical-align:top}

const fld=([k,l,t,o])=>`<div><span class="m">${l}</span>${t==="s"?`<select id="f_${k}">${opts(o)}</select>`:`<input id="f_${k}" type="${t==="n"?"number":t==="d"?"date":"text"}" ${t==="d"?`value="${today()}"`:""}>`}</div>`;
async function crud(k){
  const m=MODS[k];
  $("mn").innerHTML=`<div class="card"><h3>${m.t}</h3><div class="row">${m.f.map(fld).join("")}</div><button class="btn" id="sv">সংরক্ষণ</button> <button class="btn" id="ex" style="background:var(--ok)">Excel(CSV)</button></div><div class="card sc"><input id="q" placeholder="খুঁজুন..." style="margin-bottom:8px"><div id="ls"></div></div>`;
  let rows=await all(m.c);
  const draw=()=>{const q=$("q").value.trim();const a=rows.filter(r=>!q||JSON.stringify(r).includes(q));
    $("ls").innerHTML=`<table><tr>${m.f.map(f=>`<th>${f[1]}</th>`).join("")}<th></th></tr>`+a.map(r=>`<tr>${m.f.map(f=>`<td>${esc(r[f[0]])}</td>`).join("")}<td><button class="btn r s" data-d="${r.id}">মুছুন</button></td></tr>`).join("")+`</table>`};
  draw();$("q").oninput=draw;
  $("ls").onclick=async e=>{const id=e.target.dataset.d;if(id&&confirm("মুছে ফেলবেন?")){await del(m.c,id);rows=rows.filter(r=>r.id!==id);if(k==="stu")await loadS();draw()}};
  $("ex").onclick=()=>csv(m.t,[m.f.map(f=>f[1]),...rows.map(r=>m.f.map(f=>r[f[0]]??""))]);
  $("sv").onclick=async()=>{const o={};m.f.forEach(([key,,t])=>{const v=$("f_"+key).value.trim?.()??$("f_"+key).value;o[key]=t==="n"?+v||0:v});
    if(!Object.values(o)[0])return toast("প্রথম ঘরটি পূরণ করুন");
    await add(m.c,o);toast("সংরক্ষিত");if(k==="stu")await loadS();crud(k)};
}
function csv(name,a){const s="\ufeff"+a.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(",")).join("\n");
  const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([s],{type:"text/csv"}));l.download=name+"-"+today()+".csv";l.click()}

/* ---- ড্যাশবোর্ড ---- */
async function dash(t="hm"){
  await loadS();const [p,ie,st,ab]=await Promise.all([all("payments"),all("incomeExpense"),all("staff"),all("attendance")]);
  const mo=today().slice(0,7),sum=a=>a.reduce((s,x)=>s+(+x.amount||0),0);
  const fT=sum(p.filter(x=>x.date===today())),fM=sum(p.filter(x=>x.date.startsWith(mo)));
  const inc=fM+sum(ie.filter(x=>x.type==="আয়"&&x.date.startsWith(mo))),exp=sum(ie.filter(x=>x.type==="ব্যয়"&&x.date.startsWith(mo)));
  const td=ab.filter(a=>a.date===today()&&a.kind==="s"),pr=td.reduce((s,a)=>s+a.total-a.absent.length,0),tt=td.reduce((s,a)=>s+a.total,0);
  $(t).innerHTML=`<div class="grid">
  <div class="stat">শিক্ষার্থী<b>${students.length}</b></div><div class="stat">শিক্ষক/স্টাফ<b>${st.length}</b></div>
  <div class="stat">আজ উপস্থিতি<b>${tt?Math.round(pr*100/tt)+"%":"—"}</b></div><div class="stat">আজকের ফি<b>৳${fT}</b></div>
  <div class="stat">এ মাসের আয়<b>৳${inc}</b></div><div class="stat">এ মাসের ব্যয়<b>৳${exp}</b></div>
  <div class="stat">ব্যালেন্স<b style="color:${inc>=exp?"var(--ok)":"var(--no)"}">৳${inc-exp}</b></div></div>`;
}

/* ---- পরীক্ষার ফলাফল (GPA, মেধাতালিকা) ---- */
const gp=p=>p>=80?[5,"A+"]:p>=70?[4,"A"]:p>=60?[3.5,"A-"]:p>=50?[3,"B"]:p>=40?[2,"C"]:p>=33?[1,"D"]:[0,"F"];
async function res(){
  await loadS();const mk=await all("marks"),names=[...new Set(mk.map(x=>x.exam))];
  $("mn").innerHTML=`<div class="card"><h3>ফলাফল ও মেধাতালিকা</h3><div class="row"><select id="e">${opts(names)}</select><select id="c">${opts(CL)}</select><button class="btn" id="ld">দেখুন</button></div><div class="sc pa" id="ls"></div><button class="btn np" onclick="window.print()">প্রিন্ট</button></div>`;
  $("ld").onclick=()=>{const e=$("e").value,c=$("c").value,g={};
    mk.filter(x=>x.exam===e&&x.cls===c).forEach(x=>(g[x.roll]??=[]).push(x));
    const r=Object.entries(g).map(([roll,a])=>{const tot=a.reduce((s,x)=>s+x.marks,0),full=a.reduce((s,x)=>s+(x.full||100),0),ps=a.map(x=>gp(x.marks*100/(x.full||100)));
      const fail=ps.some(p=>p[0]===0),gpa=fail?0:ps.reduce((s,p)=>s+p[0],0)/ps.length;
      return{roll,name:students.find(s=>s.cls===c&&s.roll===roll)?.name||"",tot,full,gpa,grade:fail?"F":gp(gpa*20>=100?100:gpa*16.4)[1]}}).sort((a,b)=>b.tot-a.tot);
    $("ls").innerHTML=`<p>${esc(e)} — ক্লাস ${esc(c)}</p><table><tr><th>মেধা</th><th>রোল</th><th>নাম</th><th>মোট/${r[0]?.full||""}</th><th>GPA</th></tr>`+r.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.roll)}</td><td>${esc(x.name)}</td><td>${x.tot}</td><td>${x.gpa.toFixed(2)}${x.gpa?"":" (F)"}</td></tr>`).join("")+`</table>`};
}

/* ---- ব্যাকআপ / রিস্টোর ---- */
const COLS=["students","admissions","staff","leaves","subjects","routine","homework","exams","marks","notices","books","issues","inventory","complaints","payments","incomeExpense","attendance","settings"];
async function bak(){
  $("mn").innerHTML=`<div class="card"><h3>ব্যাকআপ ও রিস্টোর</h3><p class="m">নিয়মিত ডাউনলোড করে হার্ডডিস্ক/পেনড্রাইভে রাখুন। CSV Excel-এ দেখা যায়; রিস্টোর শুধু JSON ফাইল দিয়ে হয়, তাই দুটোই রাখুন।</p><button class="btn" id="b">সব ডেটা ডাউনলোড (JSON)</button> <button class="btn" id="bc" style="background:var(--ok)">সব ডেটা ডাউনলোড (Excel CSV)</button><hr><span class="m">রিস্টোর (ব্যাকআপ ফাইল বাছুন)</span><input type="file" id="f" accept=".json"></div>`;
  $("b").onclick=async()=>{const o={};for(const c of COLS)o[c]=await all(c);
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(o)],{type:"application/json"}));a.download="mcs-backup-"+today()+".json";a.click()};
  $("bc").onclick=async()=>{const out=[];for(const c of COLS){const a=await all(c);if(!a.length)continue;const k=[...new Set(a.flatMap(r=>Object.keys(r)))];out.push([c],k,...a.map(r=>k.map(x=>typeof r[x]==="object"?JSON.stringify(r[x]):r[x]??"")),[])}csv("সব-ডেটা-ব্যাকআপ",out)};
  $("f").onchange=async e=>{if(!confirm("বর্তমান ডেটার ওপর রিস্টোর হবে। নিশ্চিত?"))return;const o=JSON.parse(await e.target.files[0].text());let n=0;
    for(const c of COLS)if(o[c]){LS.set(c,o[c]);n+=o[c].length}toast(n+" টি রেকর্ড রিস্টোর হয়েছে")};
}
dash();
</script></body></html>
